# Portal e GeoServer atrás da Cloudflare, num servidor só (nginx na rede do host, porta 443).
#
# A política de cache fica toda aqui. A Cloudflare só guarda o que sai com Cache-Control (regra
# "Use cache-control header if present, bypass cache if not"); `s-maxage` vale para ela e
# `max-age` para o navegador. Erros e XML (como o GeoServer manda exceção e capacidades) saem
# sem Cache-Control e não ficam em cache em lugar nenhum.

upstream geoserver {
  server 127.0.0.1:8080;
  keepalive 32;
}

# A versão vigente. O portal manda a versão em cada pedido (`v=`, da `fonte_vigente`), e só a
# vigente pode ficar um ano: uma sessão aberta antes de uma base nova continua pedindo com a
# versão antiga, e a resposta, já com os dados novos, não pode ficar um ano sob ela. O core deixa
# em /etc/nginx/vigentes um arquivo vazio por versão vigente (apps/core: banco/vigentes.py),
# refeito a cada etapa; durante uma atualização da base, nenhum. Uma versão tem 16 dígitos hex:
# o resto vira vazio, e o caminho testado fica o próprio diretório, que não é um arquivo. Assim
# nenhum arquivo deixado ali, com qualquer nome, dá um ano a um `v` que não é versão.
map $arg_v $v_arquivo {
  "~^[0-9a-f]{16}$" $arg_v;
  default "";
}

# Respostas do GeoServer que podem ficar em cache. Com a versão vigente dos dados na URL, o
# conteúdo daquela URL nunca muda, e ela fica um ano, sem limpeza nenhuma depois de uma base
# nova (a versão muda, e as URLs com ela). Com outra versão (uma sessão de antes de uma base
# nova) ou sem versão (o catálogo, de onde ela vem, e o QGIS), pouco tempo: uma base nova
# aparece em um minuto sem limpar a Cloudflare.
map "$vigente|$arg_v|$upstream_http_content_type" $cache_geoserver {
  "~^1\|[^|]+\|(image/|application/json|text/csv|application/zip)" "public, max-age=31536000, immutable";
  "~^\|[^|]+\|(image/|application/json|text/csv|application/zip)" "public, max-age=60, s-maxage=60";
  "~^\|\|image/" "public, max-age=300, s-maxage=3600";
  "~^\|\|(application/json|text/csv|application/zip)" "public, max-age=60, s-maxage=60";
  default "";
}

# Tiles. Com a versão vigente do mapa na URL (`v=`, como o portal pede), o conteúdo de uma URL
# nunca muda: um ano, sem revalidar. Com outra versão, um minuto; sem versão (QGIS por WMTS),
# como os outros dados.
map "$vigente|$arg_v|$upstream_http_content_type" $cache_tile {
  "~^1\|[^|]+\|image/" "public, max-age=31536000, immutable";
  "~^\|[^|]+\|image/" "public, max-age=60, s-maxage=60";
  "~^\|\|image/" "public, max-age=300, s-maxage=3600";
  default "";
}

log_format planaveg '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time cf=$http_cf_ray';

# Os filtros que o mapa pede (tiles com CQL_FILTER), sem endereço de ninguém, num arquivo do
# servidor: o aquecimento diário semeia no cache os mais pedidos (filtros-usados.sh).
map $arg_CQL_FILTER $filtro_pedido {
  "" 0;
  default 1;
}
log_format filtros '$time_iso8601\t$status\t$uri\t$arg_CQL_FILTER';

server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  http2 on;
  server_name _;

  # A versão do pedido é a vigente? (ver o map $v_arquivo acima)
  set $vigente "";
  if (-f /etc/nginx/vigentes/$v_arquivo) {
    set $vigente "1";
  }

  # Certificado de origem da Cloudflare (modo Full strict). A chave nasce no servidor.
  ssl_certificate /etc/nginx/tls/origem.pem;
  ssl_certificate_key /etc/nginx/tls/origem.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:TLS:10m;
  ssl_session_timeout 1d;

  # Endereço de quem acessa, para o log. O firewall só deixa a Cloudflare chegar à 443, então o
  # cabeçalho que ela manda é confiável.
  real_ip_header CF-Connecting-IP;
  set_real_ip_from 0.0.0.0/0;
  set_real_ip_from ::/0;
  access_log /var/log/nginx/access.log planaveg;

  gzip on;
  gzip_proxied any;
  gzip_vary on;
  gzip_types application/javascript text/css application/json image/svg+xml text/csv
             application/xml text/xml application/vnd.ogc.se_xml;

  root /usr/share/nginx/html;

  # Portal: arquivos com hash no nome nunca mudam; o index sempre revalida. Sem `always`: um
  # 404 não pode ficar guardado por um ano.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  # GeoServer. Para todos os pedidos: chega como HTTPS no domínio público e devolve o
  # Cache-Control decidido aqui, não o dele.
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_read_timeout 300s;
  proxy_hide_header Cache-Control;
  proxy_hide_header Expires;

  # Só leitura (GET, HEAD e a pré-checagem do CORS) e só os serviços públicos. O resto
  # (/web, /rest, /gwc/rest, login) fecha: o admin entra pela tailnet, em http://planaveg:8080.
  location /geoserver/ {
    return 403;
  }

  location ~ ^/geoserver/(planaveg/)?(ows|wms|wfs)$ {
    limit_except GET OPTIONS {
      deny all;
    }
    proxy_pass http://geoserver;
    add_header Cache-Control $cache_geoserver;
  }

  location ^~ /geoserver/gwc/service/ {
    limit_except GET OPTIONS {
      deny all;
    }
    proxy_pass http://geoserver;
    add_header Cache-Control $cache_tile;
    access_log /var/log/nginx/access.log planaveg;
    access_log /var/log/planaveg/filtros.log filtros if=$filtro_pedido;
  }

  # Esquemas XML citados nas capacidades e no DescribeFeatureType (QGIS): arquivos fixos.
  location ^~ /geoserver/schemas/ {
    limit_except GET {
      deny all;
    }
    proxy_pass http://geoserver;
    add_header Cache-Control "public, max-age=86400";
  }
}

# Saúde do nginx para o healthcheck do container; só na máquina.
server {
  listen 127.0.0.1:8081;
  access_log off;

  location = /saude {
    return 200 "ok\n";
  }
}
