# Pedidos simultâneos no GeoServer (servidor de 4 vCPU). Acima do limite, o pedido espera na
# fila (até `timeout` segundos) em vez de disputar CPU e memória com os outros. Tiles já
# guardados saem rápido do GeoWebCache; o que pesa é desenhar tile novo (com filtro) e WFS.
# Sem limite por usuário (`user=`): ele marca cada visitante com cookie, e resposta com cookie
# não fica no cache da Cloudflare.
timeout=60
ows.global=48
# O GeoWebCache rende mais com 4 pedidos por núcleo (documentação da control-flow).
ows.gwc=16
ows.wms.getmap=8
ows.wms.getfeatureinfo=8
ows.wfs.getfeature=8
